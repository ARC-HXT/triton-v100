name: V100 wheel

on:
  push:
    branches: ['sm7x-on-*']
    tags: ['v*-sm7x*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v100-wheel-${{ github.ref }}
  cancel-in-progress: true

# CPython 3.13 / x86_64 manylinux_2_28 wheel, the interpreter of the vllm-v100 environment.
# Build recipe from upstream wheels.yml (cibuildwheel, clang + lld, auditwheel without bundling
# libtriton.so's dependencies); MAX_JOBS from the runner's memory instead of a fixed 4.
jobs:
  wheel:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Fit build parallelism to this runner
        # one compile job per 3 GiB of RAM (MLIR translation units), capped by cores
        run: |
          mkdir -p wheelhouse
          cores=$(nproc)
          mem_gib=$(awk '/MemTotal/ {print int($2 / 1048576)}' /proc/meminfo)
          jobs=$(( mem_gib / 3 )); if [ "$jobs" -gt "$cores" ]; then jobs=$cores; fi; if [ "$jobs" -lt 1 ]; then jobs=1; fi
          echo "MAX_JOBS=$jobs" >> "$GITHUB_ENV"
          { echo "nproc=$cores mem_gib=$mem_gib MAX_JOBS=$jobs"; df -h /; } | tee wheelhouse/runner.txt

      - name: Build the wheel
        run: |
          set -o pipefail
          python -m pip install 'cibuildwheel==4.3.5'
          export CIBW_BUILD='cp313-manylinux_x86_64'
          export CIBW_MANYLINUX_X86_64_IMAGE='quay.io/pypa/manylinux_2_28_x86_64:latest'
          export CIBW_BEFORE_ALL='dnf install clang lld -y'
          export CIBW_ENVIRONMENT="MAX_JOBS=$MAX_JOBS TRITON_BUILD_WITH_CLANG_LLD=1"
          export CIBW_REPAIR_WHEEL_COMMAND_LINUX='auditwheel repair --exclude libtriton.so -w {dest_dir} {wheel}'
          start=$(date +%s)
          python -m cibuildwheel . --output-dir wheelhouse 2>&1 | tee wheelhouse/build.log
          echo "build_seconds=$(( $(date +%s) - start ))" | tee -a wheelhouse/runner.txt

      - name: Record provenance
        run: |
          wheel=$(find wheelhouse -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$wheel"
          sha256sum wheelhouse/*.whl | tee wheelhouse/SHA256SUMS
          python -c 'import json,os; print(json.dumps(dict(commit=os.environ["GITHUB_SHA"], run_id=os.environ["GITHUB_RUN_ID"], ref=os.environ["GITHUB_REF"], max_jobs=os.environ["MAX_JOBS"]), indent=2))' > wheelhouse/build-info.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: triton-v100-cp313-${{ github.sha }}
          path: wheelhouse/
          if-no-files-found: warn
          retention-days: 1
